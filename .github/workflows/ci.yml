name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgresql://postgres:ci-only@localhost:5432/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c constraints.txt -e '.[dev]'
      - run: ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_web.py
      - run: pytest -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
